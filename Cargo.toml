[package]
name = "asd2mp4"
version = "0.2.0"
edition = "2021"
description = "Dual-Vision .asd dashcam demuxer: JPEG frames + aux/audio packets to modern mp4/wav, with full metadata"
license = "GPL-3.0-or-later"

[features]
default = []
# Full-banana build: a minimal static ffmpeg is embedded into the binary
# (assets/ffmpeg, see build.rs / README). Without this feature the small
# build is produced: same code and output, but ffmpeg is taken from PATH
# at runtime instead of being embedded.
bundled-ffmpeg = []

[dependencies]
# Intentionally std-only: the small build delegates encoding to the
# external ffmpeg, the full build to the embedded one, so the project
# builds offline with no crates.io access.

# Windows GUI (asd2gui binary, cfg(windows) only). Never linked on
# Linux/macOS, so the CLI/menu builds stay dependency-free.
[target.'cfg(windows)'.dependencies]
native-windows-gui = { version = "1", default-features = false, features = ["textbox", "progress-bar", "file-dialog"] }
native-windows-derive = "1"
